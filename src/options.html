<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Gitako sites</title>
    <style>
      :root {
        --bg: #ffffff;
        --surface: #f6f8fa;
        --text: #1f2328;
        --muted: #59636e;
        --border: #d1d9e0;
        --accent: #0969da;
        --accent-text: #ffffff;
        --danger: #cf222e;
        --warn: #9a6700;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0d1117;
          --surface: #151b23;
          --text: #e6edf3;
          --muted: #9198a1;
          --border: #3d444d;
          --accent: #4493f8;
          --accent-text: #0d1117;
          --danger: #f85149;
          --warn: #d29922;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          14px/1.5 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      main {
        max-width: 640px;
        margin: 0 auto;
        padding: 32px 16px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 4px;
      }
      p.lead {
        margin: 0 0 24px;
        color: var(--muted);
      }
      ul {
        list-style: none;
        margin: 0 0 16px;
        padding: 0;
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
      }
      li {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
        background: var(--surface);
      }
      li + li {
        border-top: 1px solid var(--border);
      }
      li.empty {
        color: var(--muted);
        justify-content: center;
      }
      .origin {
        flex: 1;
        min-width: 0;
        overflow-wrap: anywhere;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .origin small {
        display: block;
        font-family: system-ui, sans-serif;
        color: var(--warn);
      }
      li.off .origin span {
        color: var(--muted);
      }
      /* switch */
      .switch {
        position: relative;
        width: 40px;
        height: 22px;
        flex: none;
      }
      .switch input {
        position: absolute;
        inset: 0;
        margin: 0;
        opacity: 0;
        cursor: pointer;
      }
      .switch span {
        position: absolute;
        inset: 0;
        border-radius: 11px;
        background: var(--border);
        transition: background 0.15s;
        pointer-events: none;
      }
      .switch span::after {
        content: '';
        position: absolute;
        top: 3px;
        left: 3px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #fff;
        transition: transform 0.15s;
      }
      .switch input:checked + span {
        background: var(--accent);
      }
      .switch input:checked + span::after {
        transform: translateX(18px);
      }
      .switch input:focus-visible + span {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      @media (prefers-reduced-motion: reduce) {
        .switch span,
        .switch span::after {
          transition: none;
        }
      }
      button {
        font: inherit;
        border-radius: 6px;
        padding: 5px 12px;
        cursor: pointer;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--text);
      }
      button:hover {
        border-color: var(--muted);
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-text);
      }
      button.danger {
        color: var(--danger);
      }
      form {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      label.add {
        display: block;
        font-weight: 600;
        margin-bottom: 6px;
      }
      input[type='text'] {
        flex: 1;
        min-width: 200px;
        font: inherit;
        padding: 5px 10px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--text);
      }
      input[type='text']:focus {
        outline: 2px solid var(--accent);
        outline-offset: -1px;
      }
      #message {
        min-height: 1.5em;
        margin: 8px 0 0;
        color: var(--muted);
      }
      #message.error {
        color: var(--danger);
      }
      .hint {
        margin-top: 24px;
        color: var(--muted);
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Gitako sites</h1>
      <p class="lead">
        Gitako only runs on the sites switched on below. Reload open tabs after a change.
      </p>
      <ul id="sites" aria-label="Sites"></ul>
      <label class="add" for="new-site">Add a site</label>
      <form id="add-form">
        <input
          id="new-site"
          type="text"
          placeholder="https://git.example.com"
          autocomplete="off"
          spellcheck="false"
        />
        <button class="primary" type="submit">Add</button>
      </form>
      <p id="message" role="status"></p>
      <p class="hint">
        Works with GitHub, Gitea, Forgejo and Gitee. Adding a site asks the browser for access to
        it. You can also switch the current site from the Gitako toolbar button's right-click menu.
      </p>
    </main>
    <script src="options.js"></script>
  </body>
</html>
